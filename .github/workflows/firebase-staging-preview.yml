name: Deploy Payment Return Staging Preview

on:
  workflow_dispatch:
  push:
    branches:
      - staging-payment-return
    paths:
      - "staging-public/**"
      - "firebase.staging.json"
      - ".github/workflows/firebase-staging-preview.yml"

permissions:
  contents: read

jobs:
  deploy-staging-preview:
    if: github.ref == 'refs/heads/staging-payment-return'
    runs-on: ubuntu-latest

    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4

      - name: Set up Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT secret is missing."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | base64 -d > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy temporary staging preview
        run: |
          firebase hosting:channel:deploy payment-return-staging \
            --project kograhic \
            --config firebase.staging.json \
            --expires 7d
